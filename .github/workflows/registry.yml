name: registry

# 索引不靠人肉维护数字：每次 index/ 或 examples/ 变动，都用插件自己的校验器重算一遍。
# - 每份被登记的档案必须真的存在、能过校验（索引不撒谎）
# - roster 列表由仓库实际内容重算，提交者只需写“这个 collection 在哪”
# - generatedAt 由 CI 盖章，评审时能看到索引是什么时候验过的

on:
  push:
    paths:
      - "index/registry.json"
      - "examples/**"
      - "examples-orchestration/**"
      - "orgs/**"
      - "schema/**"
      - "docs/**"
      - "test/**"
      - "bin/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/registry.yml"
  pull_request:
    paths:
      - "index/registry.json"
      - "examples/**"
      - "examples-orchestration/**"
      - "orgs/**"
      - "schema/**"
      - "docs/**"
      - "test/**"
      - "bin/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/registry.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 装 devDependencies：lib/tools.js 与三个测试套件都要 import
      # `@deepseek-ai/dsh-tools`，它只是 optional peer，--omit=dev 会让「单测」这一步
      # 直接 ERR_MODULE_NOT_FOUND（2026-10-30 起本 workflow 一直红着，就是这条）。
      - run: npm ci || npm install

      - name: 校验索引格式
        run: node bin/cli.mjs registry validate --file index/registry.json

      - name: 校验每条 collection 真的能取到
        run: node bin/cli.mjs registry fetch --file index/registry.json --local-only

      - name: 重算 roster 列表并盖章
        run: |
          node bin/cli.mjs registry sync --file index/registry.json --write
          git diff --exit-code index/registry.json || {
            echo "::notice::registry.json 已被重算，请把改动一起提交";
          }

      - name: 校验组织示例库（组织文件与磁盘交叉核对）
        run: node bin/cli.mjs validate --dir orgs/agent-roster-collective

      - name: 编译 v2 示例（产物必须与源码同步）
        run: |
          node bin/cli.mjs compile --roster examples-orchestration/rosters/core-review --write
          git diff --exit-code examples-orchestration/dist/ || {
            echo "::error::dist 与源码不一致，请跑 node bin/cli.mjs compile --roster examples-orchestration/rosters/core-review --write 并提交";
            exit 1;
          }

      - name: 编译迁移示例（产物必须与源码同步）
        run: |
          for roster in examples/rosters/*; do
            node bin/cli.mjs compile --roster "$roster" --write
          done
          git diff --exit-code examples/dist/ || {
            echo "::error::examples/dist 与源码不一致，请跑 compile --write 并提交";
            exit 1;
          }

      - name: 单测
        run: node --test
