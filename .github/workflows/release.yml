name: release

# 打 tag 就是发版：给每个 **minor**（x.y.0）标签建一条 GitHub Release，正文取 CHANGELOG 里那一版。
# patch 版本不建 Release——它们只是修错，正文仍在 CHANGELOG 与 tag 里；需要时用 workflow_dispatch 手工补。
# 之前只有 tag 没有 Release（93 个标签、1 条记录），外面的人看不到「发布了什么」；
# 这步做成 workflow，不再依赖发版的人记得手动点一下。
# 正文只认 CHANGELOG 一处来源——取不到就失败，不拿空正文糊过去。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要补建 Release 的标签（如 v1.34.0）
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 决定标签
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"
          # 标签推送只给 minor 建 Release；手工触发（workflow_dispatch）不受限，用于补建。
          if [ "${{ github.event_name }}" = "push" ] && [ "${tag%.0}" = "$tag" ]; then
            echo "wanted=false" >> "$GITHUB_OUTPUT"
            echo "patch 版本不建 Release（正文在 CHANGELOG 与 tag 里）：$tag"
          else
            echo "wanted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 从 CHANGELOG 取这一版的正文
        if: steps.tag.outputs.wanted == 'true'
        run: node scripts/changelog-section.mjs "${{ steps.tag.outputs.name }}" > notes.md

      - name: 建 Release（已存在则跳过）
        if: steps.tag.outputs.wanted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，跳过"
            exit 0
          fi
          gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag --latest
