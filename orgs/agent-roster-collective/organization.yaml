# 组织档案：一座档案库的目录页。
#
# 它只做声明与核对：声明库里有哪几份档案、各自什么状态；
# 不创建团队、不改档案、不进 agent_teams_add_member 参数。
# 声明了却找不到目录 = error；目录在却没登记 = warn；已归档仍在 = info。
