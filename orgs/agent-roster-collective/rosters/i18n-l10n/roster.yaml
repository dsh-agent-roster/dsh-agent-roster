kind: "dsh-agent-roster/roster@2"
id: "i18n-l10n"
version: "1.0.0"
title: "本地化组"
description: "把一份文案做成两种语言，且两种语言说同一件事。"
license: "MIT"
maintainers:
  - "STofone"
tags:
  - "i18n"
  - "docs"
  - "review"
defaults:
  route:
    provider: "deepseek-official"
    model: "deepseek-flash"
    reasoningEffort: "high"
targets:
  - "agent-teams/members"
members:
  - as: "lead"
    role: "i18n-l10n-lead@1.0.0"
  - as: "translator"
    role: "i18n-l10n-translator@1.0.0"
  - as: "reviewer"
    role: "i18n-l10n-reviewer@1.0.0"
