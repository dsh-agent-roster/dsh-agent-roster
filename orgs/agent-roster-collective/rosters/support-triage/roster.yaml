kind: "dsh-agent-roster/roster@2"
id: "support-triage"
version: "1.0.0"
title: "客服分诊组"
description: "把每条来信分到“能自助、要人接、是缺陷”三条路之一。"
license: "MIT"
maintainers:
  - "STofone"
tags:
  - "support"
  - "triage"
defaults:
  route:
    provider: "deepseek"
    model: "deepseek-v4.1-flash"
    reasoningEffort: "high"
targets:
  - "agent-teams/members"
members:
  - as: "lead"
    role: "support-triage-lead@1.0.0"
  - as: "classifier"
    role: "support-triage-classifier@1.0.0"
  - as: "responder"
    role: "support-triage-responder@1.0.0"
