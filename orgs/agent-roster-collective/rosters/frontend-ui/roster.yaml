kind: "dsh-agent-roster/roster@2"
id: "frontend-ui"
version: "1.0.0"
title: "前端实现组"
description: "把设计做成能用、能读、能被键盘与读屏器操作的东西。"
license: "MIT"
maintainers:
  - "STofone"
tags:
  - "frontend"
  - "ui"
  - "a11y"
defaults:
  route:
    provider: "deepseek"
    model: "deepseek-v4.1-flash"
    reasoningEffort: "high"
targets:
  - "agent-teams/members"
members:
  - as: "lead"
    role: "frontend-ui-lead@1.0.0"
  - as: "implementer"
    role: "frontend-ui-implementer@1.0.0"
  - as: "a11y-reviewer"
    role: "frontend-ui-a11y-reviewer@1.0.0"
